<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Petalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --blush:#FFF6F9;
    --blush-deep:#FFE9F1;
    --pink:#FF6FA0;
    --pink-light:#FFB8D2;
    --pink-pale:#FFD9E7;
    --pink-deep:#E1467E;
    --magenta:#B0185A;
    --ink:#2B1A22;
    --muted:#A78A93;
    --line:#F6DCE6;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; font-family:'Manrope',sans-serif; color:var(--ink); overscroll-behavior:none; }
  body{
    background:radial-gradient(120% 90% at 20% 0%, #FFE0EC 0%, #FFF6F9 45%, #FDEFF4 100%);
  }

  #app{
    max-width:430px;
    height:100vh; height:100dvh;
    margin:0 auto;
    background:var(--white);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 90px -20px rgba(225,70,126,.35);
  }
  @media (min-width:431px){
    body{ display:flex; align-items:center; justify-content:center; }
    #app{ height:900px; max-height:94vh; border-radius:42px; }
  }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--white); }
  .screen.enter{ animation: slideIn .32s cubic-bezier(.22,1,.36,1) forwards; }
  .screen.leave{ animation: fadeOut .3s ease forwards; }
  @keyframes slideIn{ from{ transform:translateX(22px); opacity:0;} to{ transform:translateX(0); opacity:1;} }
  @keyframes fadeOut{ from{ opacity:1;} to{ opacity:0;} }

  .statusbar-row{
    height:28px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:12.5px; font-weight:700; color:var(--ink); flex-shrink:0;
  }
  .statusbar-row.on-light{ color:#fff; }

  .screen-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .screen-scroll::-webkit-scrollbar{ display:none; }

  /* ---------- shine + glass primitives ---------- */
  .btn{
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px;
    padding:17px 20px; border-radius:100px; border:none; cursor:pointer; width:100%;
    transition:transform .1s ease, opacity .1s ease;
    position:relative; overflow:hidden;
  }
  .btn:active{ transform:scale(.97); opacity:.94; }
  .btn-shine{
    background:linear-gradient(135deg,#FF8FB7 0%, #FF5C97 45%, #E1467E 100%);
    color:#fff;
    box-shadow:0 14px 30px -10px rgba(225,70,126,.55);
  }
  .btn-shine::after{
    content:''; position:absolute; top:0; left:-160%; width:55%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.75), transparent);
    transform:skewX(-18deg);
    animation:shineSweep 3.4s ease-in-out infinite;
  }
  @keyframes shineSweep{ 0%{left:-160%;} 38%{left:160%;} 100%{left:160%;} }
  .btn-glass{
    background:rgba(255,255,255,.7); backdrop-filter:blur(10px);
    border:1.5px solid var(--pink-pale); color:var(--pink-deep); font-weight:700;
  }
  .btn-ghost-ink{ background:transparent; color:var(--ink); font-weight:700; text-decoration:underline; text-underline-offset:3px; }

  .glass-circle{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; cursor:pointer; color:var(--pink-deep);
    box-shadow:0 8px 18px -6px rgba(176,24,90,.35);
  }
  .grad-circle{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,#FF8FB7,#E1467E);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800; font-size:16px; flex-shrink:0;
    position:relative; overflow:hidden; cursor:pointer;
    box-shadow:0 8px 16px -6px rgba(225,70,126,.6);
  }
  .grad-circle::after{
    content:''; position:absolute; top:0; left:-160%; width:60%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform:skewX(-18deg); animation:shineSweep 4s ease-in-out infinite;
  }

  /* ============ 1. SPLASH ============ */
  .splash{ height:100%; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#FF7DAA 0%, #FF5C97 40%, #E1467E 100%);
    display:flex; flex-direction:column; color:#fff;
  }
  .splash-mesh{ position:absolute; inset:0; overflow:hidden; }
  .splash-mesh .blob{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.5; }
  .splash-mesh .b1{ width:260px;height:260px; background:radial-gradient(circle,#FFD9E7,transparent 70%); top:-70px; right:-60px; }
  .splash-mesh .b2{ width:200px;height:200px; background:radial-gradient(circle,#FFFFFF,transparent 70%); bottom:60px; left:-70px; opacity:.25; }
  .splash-body{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 34px; text-align:center; }
  .splash-mark{
    width:76px;height:76px;border-radius:24px;
    background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center; font-size:36px; margin-bottom:22px;
    position:relative; overflow:hidden;
  }
  .splash-mark::after{
    content:''; position:absolute; top:0; left:-160%; width:60%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.8), transparent);
    transform:skewX(-18deg); animation:shineSweep 3s ease-in-out infinite;
  }
  .splash h1{ font-family:'Playfair Display',serif; font-weight:600; font-size:32px; letter-spacing:-.01em; }
  .splash p{ font-size:14.5px; opacity:.92; margin-top:10px; line-height:1.55; max-width:270px; }
  .splash-actions{ width:100%; max-width:280px; margin-top:34px; }
  .splash-actions .btn{ margin-bottom:12px; }
  .splash-actions .link-row{ text-align:center; font-size:13.5px; opacity:.9; }
  .splash-actions .link-row a{ color:#fff; font-weight:800; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }

  /* ============ 2. HOME ============ */
  .home-header{ padding:20px 22px 6px; flex-shrink:0; }
  .greet-row{ display:flex; justify-content:space-between; align-items:center; }
  .greet-row .loc{ font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .greet-row .loc-val{ font-size:15.5px; font-weight:800; margin-top:3px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,#FFD9E7,#FF8FB7);
    display:flex;align-items:center;justify-content:center; font-size:16px; cursor:pointer;
  }
  .search-glass{
    margin-top:16px; background:var(--blush); border:1.5px solid var(--line); border-radius:100px; padding:14px 18px;
    font-size:14px; color:var(--muted); display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .chip-row{ display:flex; gap:8px; margin-top:16px; overflow-x:auto; padding-bottom:4px; }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; font-size:12.5px; font-weight:700; padding:9px 16px; border-radius:100px;
    background:var(--blush); border:1.5px solid var(--line); color:var(--muted); white-space:nowrap; cursor:pointer;
  }
  .chip.active{ background:linear-gradient(135deg,#FF8FB7,#E1467E); color:#fff; border-color:transparent; box-shadow:0 8px 16px -6px rgba(225,70,126,.5); }

  .section-title{ display:flex; justify-content:space-between; align-items:baseline; padding:22px 22px 12px; }
  .section-title h2{ font-family:'Playfair Display',serif; font-size:19px; font-weight:600; }
  .section-title span{ font-size:12px; color:var(--pink-deep); font-weight:800; cursor:pointer; }

  .feat-scroll{ display:flex; gap:14px; padding:0 22px 6px; overflow-x:auto; scroll-snap-type:x mandatory; }
  .feat-scroll::-webkit-scrollbar{display:none;}
  .feat-card{
    flex-shrink:0; width:200px; scroll-snap-align:start; cursor:pointer;
    border-radius:22px; overflow:hidden; background:var(--white);
    box-shadow:0 16px 34px -18px rgba(176,24,90,.4); border:1.5px solid var(--line);
  }
  .feat-card:active{ transform:scale(.98); }
  .feat-thumb{
    height:104px; position:relative; display:flex; align-items:center; justify-content:center; font-size:38px;
    overflow:hidden;
  }
  .feat-thumb::after{
    content:''; position:absolute; top:0; left:-160%; width:55%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-18deg); animation:shineSweep 5s ease-in-out infinite;
  }
  .feat-badge{
    position:absolute; top:9px; right:9px; background:rgba(255,255,255,.92);
    font-size:10px; font-weight:800; padding:4px 9px; border-radius:8px; color:var(--pink-deep);
  }
  .feat-info{ padding:11px 13px 13px; }
  .feat-name{ font-weight:800; font-size:13.5px; }
  .feat-meta{ font-size:11px; color:var(--muted); margin-top:4px; font-weight:600; }

  .r-glass{
    display:flex; align-items:center; gap:14px; margin:0 22px 12px; padding:13px;
    border-radius:18px; background:var(--blush); border:1.5px solid var(--line); cursor:pointer;
  }
  .r-glass:active{ background:var(--blush-deep); }
  .r-thumb-sm{ width:54px;height:54px;border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .r-body{ flex:1; min-width:0; }
  .r-name{ font-weight:800; font-size:14px; }
  .r-meta{ font-size:11.5px; color:var(--muted); margin-top:3px; font-weight:600; }
  .r-meta .dot{ margin:0 5px; }
  .chev{ color:var(--pink-deep); font-size:16px; font-weight:800; }

  .nav-float{
    position:absolute; left:20px; right:20px; bottom:16px;
    display:flex; justify-content:space-around; align-items:center; height:64px;
    background:rgba(255,255,255,.85); backdrop-filter:blur(14px);
    border-radius:100px; border:1.5px solid var(--line);
    box-shadow:0 18px 40px -16px rgba(176,24,90,.4);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; font-weight:800; color:var(--muted); padding:4px 12px; cursor:pointer; }
  .nav-item .ic{ font-size:18px; opacity:.6; }
  .nav-item.active{ color:var(--pink-deep); }
  .nav-item.active .ic{ opacity:1; }

  /* ============ 3. MENU ============ */
  .menu-hero{
    background:linear-gradient(150deg,#FF7DAA,#E1467E);
    padding:20px 22px 24px; flex-shrink:0; position:relative; overflow:hidden; color:#fff;
  }
  .menu-hero::after{
    content:''; position:absolute; width:220px;height:220px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
    top:-90px; right:-70px;
  }
  .menu-top-row{ display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
  .menu-name{ font-family:'Playfair Display',serif; font-size:24px; font-weight:600; margin-top:18px; position:relative; z-index:1; }
  .menu-sub{ font-size:13px; opacity:.92; margin-top:5px; position:relative; z-index:1; }
  .menu-stats{ display:flex; gap:16px; margin-top:14px; font-size:12px; font-weight:700; position:relative; z-index:1; }

  .cat-chip-row{ display:flex; gap:8px; padding:16px 22px 10px; overflow-x:auto; flex-shrink:0; }
  .cat-chip-row::-webkit-scrollbar{display:none;}
  .cat-chip{ flex-shrink:0; font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:100px; background:var(--blush); border:1.5px solid var(--line); color:var(--muted); white-space:nowrap; cursor:pointer; }
  .cat-chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .item-glass{ display:flex; justify-content:space-between; align-items:center; padding:13px 22px; margin:0 0 2px; cursor:pointer; }
  .item-glass:active{ background:var(--blush); }
  .item-info .item-name{ font-weight:800; font-size:14px; }
  .item-info .item-desc{ color:var(--muted); font-size:11.5px; margin-top:4px; max-width:220px; }
  .item-info .item-price{ color:var(--pink-deep); font-weight:800; font-size:13px; margin-top:6px; }

  .cart-float{
    position:absolute; bottom:18px; left:22px; right:22px;
    background:linear-gradient(135deg,#FF8FB7,#E1467E); color:#fff; border-radius:100px; padding:16px 22px;
    display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:800; cursor:pointer;
    box-shadow:0 18px 36px -14px rgba(225,70,126,.6);
    position:absolute; overflow:hidden;
  }
  .cart-float::after{
    content:''; position:absolute; top:0; left:-160%; width:50%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform:skewX(-18deg); animation:shineSweep 4.4s ease-in-out infinite;
  }

  /* ============ 4. CART ============ */
  .sheet-header{ padding:20px 22px 8px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .sheet-header h2{ font-family:'Playfair Display',serif; font-size:20px; font-weight:600; }
  .cart-line-glass{ display:flex; justify-content:space-between; align-items:center; margin:0 22px 10px; padding:13px 15px; background:var(--blush); border-radius:16px; }
  .cart-line-name{ font-weight:800; font-size:13.5px; }
  .cart-line-price{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .qty-pill{ display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--line); border-radius:100px; padding:6px 12px; }
  .qty-pill span{ font-weight:800; font-size:13px; width:14px; text-align:center; cursor:pointer; }

  .promo-glass{ margin:14px 22px; padding:14px 17px; border-radius:16px; border:1.5px dashed var(--pink); background:var(--blush-deep); display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:800; color:var(--pink-deep); cursor:pointer; }

  .summary{ margin:14px 22px 0; padding-top:14px; border-top:1.5px solid var(--line); }
  .summary-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:9px; font-weight:600; }
  .summary-row.total{ color:var(--ink); font-size:16px; font-weight:800; margin-top:8px; }

  .pay-row{ display:flex; gap:9px; margin:16px 22px 0; }
  .pay-chip{ flex:1; text-align:center; padding:12px 6px; border-radius:14px; border:1.5px solid var(--line); font-size:11.5px; font-weight:700; color:var(--muted); cursor:pointer; }
  .pay-chip.active{ border-color:var(--pink); background:var(--blush-deep); color:var(--pink-deep); }
  .checkout-cta{ padding:14px 22px 22px; margin-top:auto; }

  /* ============ 5. TRACKING ============ */
  .track-hero{ position:relative; background:linear-gradient(150deg,#FF7DAA,#E1467E); padding:26px 24px 32px; flex-shrink:0; overflow:hidden; color:#fff; }
  .track-hero::after{ content:''; position:absolute; width:230px;height:230px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%); top:-100px; left:-60px; }
  .track-content{ position:relative; z-index:1; }
  .track-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.92); padding:7px 13px; border-radius:100px; font-size:11.5px; font-weight:800; color:var(--pink-deep); }
  .track-title{ font-family:'Playfair Display',serif; font-size:23px; font-weight:600; margin-top:16px; }
  .track-sub{ font-size:13px; opacity:.92; margin-top:5px; }

  .eta-glass{
    margin:-18px 22px 0; background:#fff; border-radius:18px; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2;
    box-shadow:0 18px 36px -18px rgba(176,24,90,.4); border:1.5px solid var(--line);
  }
  .eta-num{ font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--pink-deep); }
  .eta-lbl{ font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  .steps{ padding:28px 30px 8px; }
  .step{ display:flex; gap:14px; padding-bottom:22px; position:relative; }
  .step:not(:last-child)::before{ content:''; position:absolute; left:12px; top:27px; width:1.5px; height:calc(100% - 8px); background:var(--line); }
  .step-dot-grad{ width:26px;height:26px;border-radius:50%; background:linear-gradient(135deg,#FF8FB7,#E1467E); color:#fff; font-size:11px; display:flex;align-items:center;justify-content:center; flex-shrink:0; font-weight:800; z-index:1; }
  .step-dot-grad.pending{ background:#fff; border:1.5px solid var(--line); color:var(--muted); }
  .st-title{ font-weight:800; font-size:13.5px; }
  .st-time{ font-size:10.5px; color:var(--muted); margin-top:3px; }

  .rider-glass{ margin:8px 22px 90px; padding:14px 16px; border-radius:18px; background:var(--blush); display:flex; align-items:center; gap:12px; }
  .rider-avatar{ width:40px;height:40px;border-radius:50%; background:linear-gradient(135deg,#FF8FB7,#E1467E); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; }
  .rider-name{ font-weight:800; font-size:13px; }
  .rider-sub{ font-size:11px; color:var(--muted); }

  /* ---------- toast ---------- */
  .toast{
    position:absolute; left:50%; bottom:112px; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:100px;
    font-size:12.5px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; white-space:nowrap; z-index:80;
    box-shadow:0 12px 26px rgba(0,0,0,.28);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div class="screen" id="screenHost"></div>
</div>

<script>
/* ---------------- App state ---------------- */
let currentScreen = 'splash';
let isFavorite = false;
let cart = {
  items: [
    {id:'tagliatelle', name:'Truffle Tagliatelle', price:18.50, qty:1},
    {id:'margherita', name:'Margherita Pizza', price:14.00, qty:1}
  ],
  promo:false,
  payMethod:'card'
};
const MENU_ITEMS = {
  tagliatelle:{name:'Truffle Tagliatelle', price:18.50},
  margherita:{name:'Margherita Pizza', price:14.00},
  ossobuco:{name:'Osso Buco', price:24.00},
  tiramisu:{name:'Tiramisu', price:8.50}
};

function cartCount(){ return cart.items.reduce((s,i)=>s+i.qty,0); }
function cartSubtotal(){ return cart.items.reduce((s,i)=>s+i.price*i.qty,0); }
function cartTotals(){
  const subtotal = cartSubtotal();
  const discount = cart.promo ? +(subtotal*0.10).toFixed(2) : 0;
  const afterDiscount = subtotal - discount;
  const delivery = afterDiscount===0 ? 0 : (afterDiscount>=20 ? 0 : 2.99);
  const tax = +(afterDiscount*0.057).toFixed(2);
  const total = +(afterDiscount + delivery + tax).toFixed(2);
  return { subtotal, discount, delivery, tax, total };
}
function fmt(n){ return '$'+n.toFixed(2); }

function addToCart(id){
  const meta = MENU_ITEMS[id];
  if(!meta) return;
  const existing = cart.items.find(i=>i.id===id);
  if(existing) existing.qty++;
  else cart.items.push({id, name:meta.name, price:meta.price, qty:1});
  showToast(meta.name+' added to cart');
  updateCartBar();
}
function changeQty(id, delta){
  const item = cart.items.find(i=>i.id===id);
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) cart.items = cart.items.filter(i=>i.id!==id);
  refreshCart();
  updateCartBar();
}
function applyPromo(){
  if(cart.items.length===0){ showToast('Your cart is empty'); return; }
  if(cart.promo){ showToast('Promo already applied'); return; }
  cart.promo = true;
  showToast('Promo applied — 10% off');
  refreshCart();
}
function selectPay(el, method){
  selectPill(el);
  cart.payMethod = method;
}
function selectPill(el){
  Array.from(el.parentElement.children).forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
function toggleFav(el){
  isFavorite = !isFavorite;
  el.textContent = isFavorite ? '♥' : '♡';
  showToast(isFavorite ? 'Added to favorites' : 'Removed from favorites');
}
function updateCartBar(){
  const countEl = document.getElementById('cartCountLabel');
  const totalEl = document.getElementById('cartTotalLabel');
  const t = cartTotals();
  if(countEl) countEl.textContent = '🛍 '+cartCount()+' item'+(cartCount()===1?'':'s');
  if(totalEl) totalEl.textContent = fmt(t.total);
  if(currentScreen==='menu' && cartCount()>0 && !document.getElementById('cartBar')){
    document.getElementById('screenHost').innerHTML = screenMenu();
  }
}
function refreshCart(){
  if(currentScreen==='cart'){
    document.getElementById('screenHost').innerHTML = screenCart();
  }
}
function placeOrder(){
  if(cart.items.length===0){ showToast('Your cart is empty'); return; }
  cart = { items:[], promo:false, payMethod:cart.payMethod };
  go('track');
}
function showToast(msg){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastEl';
    t.className = 'toast';
    document.getElementById('app').appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

const screens = { splash: screenSplash, home: screenHome, menu: screenMenu, cart: screenCart, track: screenTrack };

function go(name){
  const host = document.getElementById('screenHost');
  host.classList.add('leave');
  setTimeout(()=>{
    currentScreen = name;
    host.innerHTML = screens[name]();
    host.classList.remove('leave');
    host.classList.remove('enter');
    void host.offsetWidth;
    host.classList.add('enter');
    const sc = host.querySelector('.screen-scroll');
    if(sc) sc.scrollTop = 0;
  }, 150);
}

document.getElementById('screenHost').innerHTML = screenSplash();
